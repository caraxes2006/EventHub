# docker-compose.yml
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/eventhub
      JWT_SECRET: change_me_in_production
    depends_on:
      - mongo

volumes:
  mongo-data:
